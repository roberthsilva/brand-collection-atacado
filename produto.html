<style>
  :root{
    --purple: #4a1d7a;
    --purple-deep: #3b1565;
    --paper: #ffffff;
    --stone: #f6f5f3;
    --ink: #0d0d0d;
    --graphite: #5c5c5c;
    --hairline: #e2e0dc;
    --hairline-strong: #0d0d0d;
    --ok: #2f7a4f;
    --warn: #9c5a10;
    --warn-bg: #fbf0e0;

    --font: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --ease: cubic-bezier(.16,.8,.24,1);
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font);
    font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior: auto; }
    *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }
  a{ color: inherit; }
  img, svg{ display: block; max-width: 100%; }
  button{ font-family: var(--font); }
  h1, h2, h3{ font-weight: 300; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
  .eyebrow{ display: inline-block; text-transform: uppercase; letter-spacing: 0.24em; font-size: 0.72rem; color: var(--graphite); font-weight: 600; }

  .wrap{ max-width: 1180px; margin: 0 auto; padding-inline: clamp(1.25rem, 4vw, 3rem); }
  a:focus-visible, button:focus-visible, input:focus-visible{ outline: 2px solid var(--ink); outline-offset: 3px; }

  header{ position: sticky; top: 0; z-index: 40; background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(10px); border-bottom: 1px solid var(--hairline); }
  .nav{ display: flex; align-items: center; justify-content: space-between; padding-block: 1.1rem; }
  .mark{ display: flex; align-items: center; gap: 0.5rem; font-size: clamp(.82rem,2.4vw,.98rem); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; text-decoration: none; color: var(--ink); white-space: nowrap; }
  .mark .dot{ width: 6px; height: 6px; background: var(--ink); flex-shrink:0; }
  .mark .sub{ font-weight: 400; color: var(--graphite); }
  .nav-links{ display: flex; align-items: center; gap: clamp(1rem, 2.5vw, 2.2rem); font-size: 0.78rem; }
  .nav-links a:not(.btn){ position: relative; text-decoration: none; text-transform: uppercase; letter-spacing: 0.14em; color: var(--ink); padding-bottom: 3px; }
  .nav-links a:not(.btn)::after{ content: ""; position: absolute; left: 0; right: 100%; bottom: 0; height: 1px; background: var(--ink); transition: right 0.3s var(--ease); }
  .nav-links a:not(.btn):hover::after{ right: 0; }
  .nav-links .hide-mobile{ display: inline; }
  @media (max-width: 680px){ .nav-links .hide-mobile{ display: none; } }
  @media (max-width: 480px){ .nav-links a.nav-info{ font-size: .66rem; letter-spacing: .06em; } .nav-links .social-icon{ display: none; } .nav-links .btn{ padding: .7rem .75rem; letter-spacing: .08em; } }
  @media (max-width: 400px){ .nav{ gap: .6rem; } .nav-links .btn .short{ display: none !important; } .nav-links .btn{ padding: .7rem !important; gap: 0; } }
  /* celular: cabeçalho enxuto (Informações continua no rodapé) */
  @media (max-width: 680px){ .nav-links a.nav-info{ display: none; } .nav-start .mark, .nav .mark{ min-width: 0; } .nav-links .btn{ flex-shrink: 0; } }
  .nav-links .btn .short{ display: none; }
  @media (max-width: 460px){
    .nav-links .btn .full{ display: none; }
    .nav-links .btn .short{ display: inline; }
    .nav-links .btn{ padding: 0.7rem 0.9rem; }
  }
  @media (max-width: 480px){
    .mark{ font-size: .72rem; letter-spacing: 0.03em; gap: .4rem; }
    .mark .sub{ display: none; }
    .nav-links{ gap: .7rem; }
  }
  @media (max-width: 360px){
    .nav-links .btn .short{ display: none; }
    .nav-links .btn{ padding: 0.7rem; gap: 0; }
  }
  .social-icon{ display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; color: var(--ink); flex-shrink: 0; padding-bottom: 0 !important; }
  .social-icon::after{ content: none !important; }
  .social-icon svg{ width: 100%; height: 100%; }
  .social-icon:hover{ color: var(--graphite); }
  .cart-btn{
    display: inline-flex; align-items: center; gap: .45rem; flex-shrink: 0;
    padding: .55rem .8rem; border: none; cursor: pointer; text-decoration: none;
    background: var(--purple); color: var(--paper); font: inherit; line-height: 1;
    transition: background .2s ease;
  }
  .cart-btn:hover{ background: var(--ink); }
  .cart-btn svg{ width: 18px; height: 18px; }
  .cart-btn .cart-count{
    display: inline-flex; align-items: center; justify-content: center;

    background: var(--paper); color: var(--purple); font-size: .68rem; font-weight: 700;

  @media (max-width: 480px){ .cart-btn{ padding: .55rem .6rem; gap: .35rem; } }
  @media (max-width: 400px){ .nav-links .cart-btn{ padding: .55rem .5rem; } .cart-btn svg{ width: 16px; height: 16px; } }

  .btn{
    position: relative; display: inline-flex; align-items: center; gap: 0.6rem;
    padding: 0.85rem 1.5rem; font-size: 0.76rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.14em; text-decoration: none; cursor: pointer; white-space: nowrap;
    overflow: hidden; isolation: isolate; border: none;
    transition: color 0.4s var(--ease), border-color 0.4s var(--ease), transform 0.3s var(--ease);
  }
  .btn::before{ content: ""; position: absolute; inset: 0; z-index: -1; transform: scaleX(0); transform-origin: left; transition: transform 0.45s var(--ease); }
  .btn:hover{ transform: translateY(-1px); }
  .btn-primary{ background: var(--purple); color: var(--paper); border: 1px solid var(--purple); }
  .btn-primary::before{ background: var(--paper); }
  .btn-primary:hover{ color: var(--purple); }
  .btn-primary:hover::before{ transform: scaleX(1); }
  .btn-outline{ background: transparent; color: var(--purple); border: 1px solid var(--purple); }
  .btn-outline::before{ background: var(--purple); }
  .btn-outline:hover{ color: var(--paper); }
  .btn-outline:hover::before{ transform: scaleX(1); }
  .btn-block{ width: 100%; justify-content: center; }
  .btn:disabled{ opacity: .4; cursor: not-allowed; transform: none !important; }

  .crumb a:hover{ color: var(--ink); text-decoration: underline; }

  .product{ display: grid; grid-template-columns: minmax(0,560px) 1fr; gap: clamp(2rem, 5vw, 4rem); padding-block: 1.6rem clamp(3rem, 6vw, 5rem); align-items: start; }

  .product-info{ padding-top: .3rem; }

  .product-price{ font-size: 1.7rem; font-weight: 600; }

  .stock-badge{ display: inline-flex; align-items: center; gap: .5rem; font-size: .76rem; text-transform: uppercase; letter-spacing: .08em; padding: .5rem .8rem; border: 1px solid var(--ink); margin-bottom: 1.3rem; }
  .stock-badge.out{ color: var(--graphite); border-color: var(--hairline); }
  .stock-badge .dot{ width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex-shrink: 0; }
  .stock-badge.out .dot{ background: var(--graphite); }

  .qty-row{ display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
  .qty-stepper{ display: flex; align-items: center; border: 1px solid var(--hairline); }

  .qty-row .unit{ font-size: .78rem; color: var(--graphite); text-transform: uppercase; letter-spacing: .06em; }

  .product-actions{ display: flex; flex-direction: column; gap: .7rem; max-width: 420px; margin-bottom: 1.8rem; }

  .product-desc{ border-top: 1px solid var(--hairline); padding-top: 1.4rem; margin-top: .4rem; color: var(--graphite); font-size: .92rem; max-width: 56ch; }

  .cart-item{ display: flex; gap: .7rem; padding-block: .8rem; border-bottom: 1px solid var(--hairline); }

  .cart-item-info{ flex: 1; min-width: 0; }

  .cart-item-controls{ display: flex; align-items: center; gap: .5rem; margin-top: .5rem; }

  .cart-item-remove{ margin-left: auto; background: none; border: none; color: var(--graphite); font-size: .72rem; text-decoration: underline; cursor: pointer; text-underline-offset: 2px; }
  .cart-item-remove:hover{ color: var(--ink); }
  .cart-item-linetotal{ font-size: .82rem; font-weight: 600; white-space: nowrap; }
  .min-order-note{ display: flex; align-items: center; gap: .5rem; background: var(--warn-bg); color: var(--warn); font-size: .78rem; padding: .65rem .8rem; margin-bottom: 1rem; }
  .cart-total-row{ display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .9rem; }
  .cart-total-row .label{ font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--graphite); }
  .cart-total-row .value{ font-size: 1.15rem; font-weight: 600; }
  .cart-btn-primary{ display: block; width: 100%; text-align: center; padding: .9rem 1rem; background: var(--purple); color: var(--paper); border: 1px solid var(--purple); font-family: var(--font); font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; cursor: pointer; transition: all .18s ease; }

  .cart-btn-primary:disabled{ opacity: .4; cursor: not-allowed; }

  .not-found{ padding-block: 6rem; text-align: center; color: var(--graphite); }
</style>

  <script>
    const WHATSAPP_NUMBER = '5511964051453';
    const MIN_ORDER_QTY = 10;
    let PRODUCTS = [];
    let PRODUCTS_BY_ID = {};

    function fmtBRL(v){
      if (v === null || v === undefined || isNaN(v)) return '';
      return 'R$' + Number(v).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?=,))/g, '.');
    }

    function parseCatalogJs(text){
      const marker = 'window.CATALOG_DATA = ';
      const start = text.indexOf(marker);
      if (start === -1) throw new Error('formato inesperado');
      let jsonText = text.slice(start + marker.length).trim();
      if (jsonText.endsWith(';')) jsonText = jsonText.slice(0, -1);
      return JSON.parse(jsonText);
    }

    function loadViaScriptTag(){
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'data.js';
        script.onload = () => {
          if (window.CATALOG_DATA) resolve(window.CATALOG_DATA);
          else reject(new Error('data.js carregou mas CATALOG_DATA não foi definido'));
        };
        script.onerror = () => reject(new Error('não consegui carregar data.js'));
        document.head.appendChild(script);
      });
    }

    async function loadViaFetch(){
      const res = await fetch('data.js?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      return parseCatalogJs(text);
    }

    function getProductIdFromUrl(){
      return new URLSearchParams(location.search).get('id');
    }

    let qty = 1;

    function productHtml(p){
      const esg = p.esgotado;
      const oldPriceHtml = p.oldPrice ? `<span class="product-old-price">${fmtBRL(p.oldPrice)}</span>` : '';
      return `
        <div class="product">
          <div class="product-photo${esg ? ' is-esgotado' : ''}">
            <img src="${p.img || p.thumb}" alt="${p.name.replace(/"/g,'&quot;')}">
          </div>
          <div class="product-info">
            <span class="eyebrow product-cat">${p.category}</span>
            <h1>${p.name}</h1>
            <div class="product-price-row">
              <span class="product-price">${fmtBRL(p.price)}</span>
              ${oldPriceHtml}
            </div>
            <div class="stock-badge${esg ? ' out' : ''}"><span class="dot"></span>${esg ? 'Esgotado no momento' : 'Em estoque'}</div>

            ${esg ? '' : `
            <div class="qty-row">
              <div class="qty-stepper">
                <button id="qty-dec" aria-label="Diminuir quantidade">−</button>
                <span id="qty-val">1</span>
                <button id="qty-inc" aria-label="Aumentar quantidade">+</button>
              </div>
              <span class="unit">unidade(s) · pedido mínimo ${MIN_ORDER_QTY}</span>
            </div>`}

            <div class="product-actions">
              ${esg
                ? `<button class="btn btn-primary btn-block" disabled>Produto esgotado</button>`
                : `<button class="btn btn-primary btn-block" id="btn-add-product">Adicionar ao pedido</button>`}
              <a class="btn btn-outline btn-block" href="index.html#catalogo">Voltar para a loja</a>
            </div>

            ${p.description ? `<div class="product-desc">${p.description.replace(/\n/g,'<br>')}</div>` : ''}

            <div class="seller-box">
              <p>Ficou com alguma dúvida sobre esse produto?</p>
              <a class="btn btn-outline" id="talk-seller" target="_blank" rel="noopener">Falar com o vendedor</a>
            </div>
          </div>
        </div>
      `;
    }

    function renderNotFound(){
      document.getElementById('product-slot').innerHTML = `
        <div class="not-found">
          <h1>Produto não encontrado</h1>
          <p style="margin-top:.8rem">Esse produto pode ter sido removido ou o link está incorreto.</p>
          <a class="btn btn-primary" style="margin-top:1.6rem" href="index.html#catalogo">Voltar para a loja</a>
        </div>
      `;
    }

    function renderProduct(p){
      document.title = p.name + ' · Brand Collection Atacado';
      document.getElementById('crumb-cat').textContent = p.category;
      document.getElementById('product-slot').innerHTML = productHtml(p);

      const qtyValEl = document.getElementById('qty-val');
      const decBtn = document.getElementById('qty-dec');
      const incBtn = document.getElementById('qty-inc');
      if (decBtn && incBtn){
        decBtn.addEventListener('click', () => { qty = Math.max(1, qty - 1); qtyValEl.textContent = qty; });
        incBtn.addEventListener('click', () => { qty = qty + 1; qtyValEl.textContent = qty; });
      }

      const addBtn = document.getElementById('btn-add-product');
      if (addBtn){
        addBtn.addEventListener('click', () => {
          for (let i = 0; i < qty; i++) addToCart(p.id);
          addBtn.textContent = 'Adicionado ✓';
          setTimeout(() => { addBtn.textContent = 'Adicionar ao pedido'; }, 1200);
        });
      }

      const talkBtn = document.getElementById('talk-seller');
      if (talkBtn){
        const msg = `Olá! Tenho uma dúvida sobre o produto "${p.name}".`;
        talkBtn.href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
      }
    }

    async function init(){
      try {
        const data = (location.protocol === 'file:') ? await loadViaScriptTag() : await loadViaFetch();
        PRODUCTS = data.products || [];
        PRODUCTS.forEach(p => { PRODUCTS_BY_ID[p.id] = p; });
      } catch(e){
        console.error('Falha ao carregar catálogo:', e);
        renderNotFound();
        return;
      }
      const id = getProductIdFromUrl();
      const product = id ? PRODUCTS_BY_ID[id] : null;
      if (!product){ renderNotFound(); return; }
      renderProduct(product);
      updateCartBadge();
    }

    // ---------------- cart (shared with index.html via localStorage) ----------------
    function loadCart(){
      try { return JSON.parse(localStorage.getItem('bc_cart')) || {}; }
      catch(e){ return {}; }
    }
    function saveCart(){ localStorage.setItem('bc_cart', JSON.stringify(cart)); }

    let cart = loadCart();
    let cartView = 'items';

    function cartEntries(){
      return Object.entries(cart)
        .map(([id, qty]) => ({ id, qty, product: PRODUCTS_BY_ID[id] }))
        .filter(e => e.product);
    }
    function cartTotalQty(){ return cartEntries().reduce((s, e) => s + e.qty, 0); }
    function cartTotalPrice(){ return cartEntries().reduce((s, e) => s + e.qty * (e.product.price || 0), 0); }

    const cartFab = document.getElementById('cart-btn');
    const cartCountEl = document.getElementById('cart-count');
    const cartOverlay = document.getElementById('cart-overlay');
    const cartDrawer = document.getElementById('cart-drawer');
    const cartBody = document.getElementById('cart-body');
    const cartFoot = document.getElementById('cart-foot');
    const cartTitle = document.getElementById('cart-title');

    function updateCartBadge(){ cartCountEl.textContent = cartTotalQty(); }

    function openCart(){ cartView = 'items'; renderCartDrawer(); cartOverlay.classList.add('open'); cartDrawer.classList.add('open'); }
    function closeCart(){ cartOverlay.classList.remove('open'); cartDrawer.classList.remove('open'); }

    function addToCart(id){
      cart[id] = (cart[id] || 0) + 1;
      saveCart();
      updateCartBadge();
    }
    function setQty(id, q){
      if (q <= 0) delete cart[id]; else cart[id] = q;
      saveCart();
      updateCartBadge();
      renderCartDrawer();
    }
    function removeFromCart(id){ setQty(id, 0); }

    function renderCartDrawer(){ renderItemsView(); }

    function renderItemsView(){
      cartTitle.textContent = 'Seu carrinho';
      const entries = cartEntries();
      if (entries.length === 0){
        cartBody.innerHTML = `<div class="cart-empty">Seu carrinho está vazio.<br>Adicione produtos pra montar seu pedido.</div>`;
        cartFoot.innerHTML = '';
        return;
      }
      cartBody.innerHTML = entries.map(e => `
        <div class="cart-item" data-id="${e.id}">
          <img src="${e.product.img || e.product.thumb}" alt="">
          <div class="cart-item-info">
            <div class="cart-item-name">${e.product.name}</div>
            <div class="cart-item-price">${fmtBRL(e.product.price)} / un</div>
            <div class="cart-item-controls">
              <button class="qty-btn" data-action="dec">−</button>
              <span class="qty-val">${e.qty}</span>
              <button class="qty-btn" data-action="inc">+</button>
              <button class="cart-item-remove" data-action="remove">remover</button>
            </div>
          </div>
          <div class="cart-item-linetotal">${fmtBRL(e.product.price * e.qty)}</div>
        </div>
      `).join('');

      const totalQty = cartTotalQty();
      const totalPrice = cartTotalPrice();
      const missing = MIN_ORDER_QTY - totalQty;
      const minNote = missing > 0
        ? `<div class="min-order-note">Faltam ${missing} unidade${missing > 1 ? 's' : ''} pra atingir o pedido mínimo de ${MIN_ORDER_QTY}.</div>`
        : '';

      cartFoot.innerHTML = `
        ${minNote}
        <div class="cart-total-row">
          <span class="label">Total (${totalQty} un.)</span>
          <span class="value">${fmtBRL(totalPrice)}</span>
        </div>
        <a class="cart-btn-primary" href="index.html#catalogo" style="${missing > 0 ? 'pointer-events:none;opacity:.4' : ''}">Ver carrinho e finalizar</a>
      `;

      cartBody.querySelectorAll('.cart-item').forEach(row => {
        const id = row.dataset.id;
        row.querySelector('[data-action="inc"]').addEventListener('click', () => setQty(id, (cart[id] || 0) + 1));
        row.querySelector('[data-action="dec"]').addEventListener('click', () => setQty(id, (cart[id] || 0) - 1));
        row.querySelector('[data-action="remove"]').addEventListener('click', () => removeFromCart(id));
      });
    }

    cartFab.addEventListener('click', openCart);
    document.getElementById('cart-close').addEventListener('click', closeCart);
    cartOverlay.addEventListener('click', closeCart);

    init();
  </script>

</body>
